name: Dayline Dispatch

on:
  workflow_dispatch:
    inputs:
      check_connections:
        description: 'Only test Blogger access and a tiny Gemini response; create no posts'
        type: boolean
        default: false
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: '2-57/5 * * * *'

concurrency:
  group: dayline-dispatch-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py' -v
  publish:
    needs: test
    if: vars.CLOUD_ENABLED == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test publishing controls
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Discover, research and publish
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          FREE_TIER_CONFIRMED: ${{ vars.FREE_TIER_CONFIRMED }}
          MAX_STORIES_PER_RUN: ${{ vars.MAX_STORIES_PER_RUN || '1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.check_connections }}" = "true" ]; then
            python -u publisher.py --check-connections
          else
            python -u publisher.py
          fi
      - name: Preserve queue even when a source fails
        if: always()
        run: |
          git config user.name 'dayline-dispatch-bot'
          git config user.email 'dayline-dispatch-bot@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update publishing queue [skip ci]'
            git push
          fi
