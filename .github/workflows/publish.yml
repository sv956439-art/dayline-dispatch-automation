name: Dayline Dispatch

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: '2-57/5 * * * *'

concurrency:
  group: dayline-dispatch-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py' -v
  publish:
    needs: test
    if: vars.CLOUD_ENABLED == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test publishing controls
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Discover and preserve queue while local host is pending
        env:
          AI_BACKEND: local
          AI_ENABLED: 'false'
          AUTO_PUBLISH: 'false'
        run: |
          python -u publisher.py
          echo 'Local-only mode: discovery completed; publication awaits a configured model host. No AI/search/Blogger API credentials were supplied.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve queue even when a source fails
        if: always()
        run: |
          git config user.name 'dayline-dispatch-bot'
          git config user.email 'dayline-dispatch-bot@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update publishing queue [skip ci]'
            git pull --rebase origin main
            git push
          fi
